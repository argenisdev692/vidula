name: Authentication
description: |-

  Stateless token-based authentication for mobile / external clients (Sanctum
  personal access tokens). The web app uses session auth via Fortify and must
  NOT call these endpoints.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/auth/login
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Stateless token-based authentication for mobile / external clients (Sanctum
        personal access tokens). The web app uses session auth via Fortify and must
        NOT call these endpoints.
      subgroup: ''
      subgroupDescription: ''
      title: 'Log in and issue an API token'
      description: |-
        Verifies credentials, enforces email verification + account lockout, then
        issues a rotated Sanctum token (admins expire in 1h, users in 24h).
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: 'The account email.'
        required: true
        example: jane@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'The account password.'
        required: true
        example: Sup3rS3cret!2026
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      device_name:
        custom: []
        name: device_name
        description: 'The device label used as the token name.'
        required: false
        example: iphone-15
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: jane@example.com
      password: Sup3rS3cret!2026
      device_name: iphone-15
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"token":"3|abc...","token_type":"Bearer","expires_at":"2026-06-23T10:00:00+00:00","user":{"uuid":"...","email":"jane@example.com"}}'
        headers: []
        description: Success
      -
        custom: []
        status: 403
        content: '{"message":"Your email address is not verified."}'
        headers: []
        description: 'Email not verified'
      -
        custom: []
        status: 422
        content: '{"message":"These credentials do not match our records.","errors":{"email":["These credentials do not match our records."]}}'
        headers: []
        description: 'Invalid credentials'
      -
        custom: []
        status: 429
        content: '{"message":"Account temporarily locked.","retry_after":840}'
        headers: []
        description: 'Account locked'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/auth/otp/request
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        Passwordless (OTP) login for API clients: request a code, then exchange the
        code for a Sanctum token. Uses consumeOneTimePassword() (no session login).

        Note: the package's `enforce_same_origin` option assumes a stateful origin;
        for pure stateless API clients set it to `DoNotEnforceOrigin` in
        config/one-time-passwords.php.
      subgroup: ''
      subgroupDescription: ''
      title: 'Request a one-time password by email'
      description: ''
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: ''
        required: true
        example: jane@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: jane@example.com
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message":"If the email exists, a one-time password has been sent."}'
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
